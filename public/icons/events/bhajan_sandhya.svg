      <circle cx="50" cy="62" r="14" fill="#C7A45A" stroke="#8C6228" stroke-width="1.5"/>
      <circle cx="50" cy="62" r="5" fill="#FAF1D9"/>
      <!-- Tanpura bridge & strings -->
      <path d="M46 28 L54 28" stroke="#6F1D35" stroke-width="2.5"/>
      <path d="M46 34 L54 34" stroke="#6F1D35" stroke-width="2.5"/>
