<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="60%" stop-color="#FDF3DF"/>
      <stop offset="100%" stop-color="#F7E2B5"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9CB7F"/>
      <stop offset="50%" stop-color="#C7A45A"/>
      <stop offset="100%" stop-color="#8C6228"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D32F2F"/>
      <stop offset="50%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#FFEB3B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#8C6228" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Badge Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#bgGrad)" stroke="#C7A45A" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#E6BE68" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.7"/>
  
      <!-- Morchhari (Peacock Feather) & Divine Bow -->
      <path d="M50 20 C60 26 62 42 50 56 C38 42 40 26 50 20 Z" fill="#2E7D32" stroke="#1B5E20" stroke-width="1.5"/>
      <circle cx="50" cy="36" r="9" fill="#1565C0"/>
      <circle cx="50" cy="36" r="5" fill="#FBC02D"/>
      <circle cx="50" cy="36" r="2.5" fill="#0D47A1"/>
      <!-- Feather Stem -->
      <path d="M50 56 L50 75" stroke="#C7A45A" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="50" cy="48" r="30" stroke="#E6BE68" stroke-width="1.5" stroke-dasharray="3 4" fill="none"/>
    
</svg>