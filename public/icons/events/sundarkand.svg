<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="60%" stop-color="#FDF3DF"/>
      <stop offset="100%" stop-color="#F7E2B5"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9CB7F"/>
      <stop offset="50%" stop-color="#C7A45A"/>
      <stop offset="100%" stop-color="#8C6228"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D32F2F"/>
      <stop offset="50%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#FFEB3B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#8C6228" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Badge Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#bgGrad)" stroke="#C7A45A" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#E6BE68" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.7"/>
  
      <!-- Holy Ramayan / Granth & Gada -->
      <path d="M25 40 Q50 32 50 68 Q25 60 25 40 Z" fill="#FAF1D9" stroke="#8C6228" stroke-width="1.5"/>
      <path d="M75 40 Q50 32 50 68 Q75 60 75 40 Z" fill="#FFFDF8" stroke="#8C6228" stroke-width="1.5"/>
      <!-- Book spine & Sacred Om -->
      <path d="M50 32 L50 68" stroke="#6F1D35" stroke-width="2"/>
      <circle cx="50" cy="24" r="8" fill="#FDF3DE" stroke="#C7A45A"/>
      <text x="50" y="27" font-size="9" text-anchor="middle" font-weight="bold" fill="#6F1D35">राम</text>
      <!-- Gada Icon on side -->
      <path d="M42 66 L58 66 L55 74 L45 74 Z" fill="#C7A45A"/>
    
</svg>